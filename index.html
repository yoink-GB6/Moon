  document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f0eee6" : "#101010";
})();
</script>

<script type="module">
const _V = Date.now(); // 缓存破坏版本号，每次加载页面时生成
import { showToast, initSidebar, toggleSidebar, closeSidebar, toggleRightPanel,
         initRightPanel, findRightPanel, confirmDialog } from './core/ui.js';
import { isEditor, tryUnlock, lock, onAuthChange, initAuth } from './core/auth.js';
import { initTheme, toggleTheme } from './core/theme.js';
import { parseHash, go, onRouteChange } from './core/router.js';
import { iconSun, iconCloud, iconCloudSm, iconBird, iconHorizon,
         moonCrescent, iconConstellation,
         iconStar, iconStarSm } from './core/icons.js';

// ── Router config ──────────────────────────────────
// 添加新页面：在这里加一条记录，并在 pages/ 目录下建对应 .js 文件
const ROUTES = [
  {
    id: 'home',
    label: '⌂ 主页',
    icon: '⌂',
    loader: () => import('./pages/home.js?v='+_V),
  },
  {
    id: 'geo',
    label: '⚑ 国家',
    icon: '⚑',
    loader: () => import('./pages/geo.js?v='+_V),
  },
  {
    id: 'characters',
    label: '☲ 人物',
    icon: '☲',
    loader: () => import('./pages/characters.js?v='+_V),
  },
  {
    id: 'relations',
    label: '❖ 关系网',
    icon: '❖',
    loader: () => import('./pages/relations.js?v='+_V),
  },

  {
    id: 'library',
    label: '¶ 指令集',
    icon: '¶',
    loader: () => import('./pages/library.js?v='+_V),
  },
  {
    id: 'gacha',
    label: '✦ 抽卡',
    icon: '✦',
    loader: () => import('./pages/gacha.js?v='+_V),
  },
  {
    id: 'tv',
    label: '▬ 上电视',
    icon: '▬',
    loader: () => import('./pages/tv.js?v='+_V),
  },
];

// ── State ──────────────────────────────────────────
let currentRoute = null;
let currentModule = null;
let _navSeq = 0;

// ── Build nav ──────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = ROUTES.map(r => `
    <div class="nav-item${r.id===currentRoute?.id?' active':''}" data-id="${r.id}">
      <span class="nav-icon">${r.icon}</span>
      <span class="nav-label">${r.label.replace(r.icon,'').trim()}</span>
      ${r.placeholder ? '<span style="font-size:10px;color:var(--text-faint);margin-left:auto">soon</span>' : ''}
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      go(el.dataset.id);
      closeSidebar();
    });
  });
}

// ── Navigate ────────────────────────────────────────
async function tryLoad(loader, maxAttempts = 3) {
  for (let i = 0; i < maxAttempts; i++) {
    try { return await loader(); }
    catch(e) {
      if (i === maxAttempts - 1) throw e;
      await new Promise(r => setTimeout(r, 600 * (i + 1)));
    }
  }
}

// parts = hash 里页面 id 之后的片段，交给页面模块自己解释（通常是要打开哪个弹窗）
async function navigate(id, parts = []) {
  const route = ROUTES.find(r => r.id === id) || ROUTES[0];
  // 同一页只需把新的 parts 交给它，不重新挂载
  if (currentRoute?.id === route.id) {
    currentModule?.applyRoute?.(parts);
    return;
  }

  if (currentModule?.unmount) currentModule.unmount();

  currentRoute = route;
  currentModule = null;
  buildNav();

  // 换页时把顶栏放回来，否则在会滚动的页面收起后，
  // 切到不滚动的页面就再也没机会把它唤出来了
  document.getElementById('topbar').classList.remove('hide');

  const root = document.getElementById('page-root');
  root.innerHTML = '';
  syncToggleBtns();  // 先隐藏；挂载完再按新页面是否有右侧面板决定

  if (route.placeholder) {
    root.innerHTML = `
      <div class="page-placeholder">
        <div class="placeholder-icon">${route.icon}</div>
        <h2>${route.label.replace(route.icon,'').trim()}</h2>
        <p>hiraeth</p>
      </div>`;
    return;
  }

  const seq = ++_navSeq;
  try {
    const mod = await tryLoad(route.loader);
    if (seq !== _navSeq) return;
    if (!mod) {
      root.innerHTML = `<div class="page-placeholder"><div class="placeholder-icon">${route.icon}</div><h2>hiraeth</h2></div>`;
      return;
    }
    currentModule = mod;
    await mod.mount(root);
    mod.applyRoute?.(parts);
    initRightPanel();
    sessionStorage.removeItem('_navReloadAttempted');
  } catch(e) {
    if (seq !== _navSeq) return;
    console.error(`页面 ${route.id} 加载失败`, e);
    if (!sessionStorage.getItem('_navReloadAttempted')) {
      sessionStorage.setItem('_navReloadAttempted', '1');
      location.reload();
      return;
    }
    root.innerHTML = `<div class="page-placeholder"><div class="placeholder-icon">⚠️</div><h2>加载失败</h2><p>${e.message}</p></div>`;
  }
}

// ── Auth UI ────────────────────────────────────────
onAuthChange(editor => {
  const btn = document.getElementById('lock-btn');
  const banner = document.getElementById('readonly-banner');
  btn.textContent = editor ? 'EDITING' : 'READONLY';
  btn.classList.toggle('unlocked', editor);
  if (banner) banner.classList.toggle('show', !editor);
  if (!editor) buildNav();
});

// ── Password modal ─────────────────────────────────
const pwInput = document.getElementById('pw-input');
const pwModal = document.getElementById('pw-modal');

window.showPwModal = function() {
  if (isEditor()) { lock(); return; }
  pwInput.value = '';
  pwInput.classList.remove('err');
  pwModal.classList.add('show');
  setTimeout(() => pwInput.focus(), 60);
};
window.closePwModal = function() {
  pwModal.classList.remove('show');
  pwInput.classList.remove('err');
  pwInput.value = '';
};
let _pwBusy = false;
window.submitPw = async function() {
  if (_pwBusy) return;
  _pwBusy = true;
  pwInput.disabled = true;
  const { ok, message } = await tryUnlock(pwInput.value);
  pwInput.disabled = false;
  _pwBusy = false;

  if (ok) {
    window.closePwModal();
    showToast('ok 已解锁编辑模式');
  } else {
    // 无文案，用输入框自身抖动 + 变红表达失败
    console.warn('[auth] 登录失败：', message);
    pwInput.value = '';
    pwInput.classList.remove('err');
    void pwInput.offsetWidth;   // 强制重排，让动画能连续触发
    pwInput.classList.add('err');
    pwInput.focus();
  }
};

// 用真 <form>：手机端软键盘才会出「前往/Go」键并提交
document.getElementById('pw-box').addEventListener('submit', e => {
  e.preventDefault();
  window.submitPw();
});
pwInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.stopPropagation(); window.closePwModal(); }
});
pwModal.addEventListener('click', e => {
  if (e.target === pwModal) window.closePwModal();
});

// ── 图标注入 ───────────────────────────────────────
// 各五个符号，视觉重心都落在中间那个
document.querySelector('#theme-toggle .th-day').innerHTML =
  iconBird + iconCloud + iconSun + iconCloudSm + iconHorizon;
document.querySelector('#theme-toggle .th-night').innerHTML =
  iconConstellation + iconStarSm + moonCrescent + iconCloud + iconStar;

// ── 顶栏左右按钮 ───────────────────────────────────
// 抽屉状态由 core/ui.js 统一管理，这里只负责把状态映射到按钮外观。
function syncToggleBtns() {
  const sb = document.getElementById('sidebar');
  const p  = findRightPanel();
  document.getElementById('nav-btn')
    .classList.toggle('active', !sb.classList.contains('collapsed'));
  const btn = document.getElementById('panel-btn');
  btn.hidden = !p;
  btn.classList.toggle('active', !!p && !p.classList.contains('collapsed'));
}
document.addEventListener('drawer-change', syncToggleBtns);

document.getElementById('nav-btn').addEventListener('click', () => { lockTopbar(); toggleSidebar(); });
document.getElementById('panel-btn').addEventListener('click', () => { lockTopbar(); toggleRightPanel(); });

// ── 顶栏随滚动收起 ─────────────────────────────────
// 各 page 有自己的滚动容器（html/body 是 overflow:hidden），
// scroll 不冒泡但会捕获，所以在 document 上捕获监听，按来源分别记录位置。
const _lastScroll = new WeakMap();
let _topbarLock = 0;

// 只认页面主内容的滚动。弹窗、侧栏、右侧面板自己的滚动不该动顶栏。
const IGNORE_SCROLL = '.tl-modal-overlay,#pw-modal,#sidebar,.side-panel';

// 抽屉开合会改变内容区宽度 → 多列重排 → 高度变化 → 浏览器补发 scroll 事件。
// 那不是用户滚的，不该动顶栏，所以在动画期间锁住。
function lockTopbar(ms = 600) { _topbarLock = performance.now() + ms; }

function setTopbarHidden(hide) {
  const topbar = document.getElementById('topbar');
  if (topbar.classList.contains('hide') === hide) return;
  topbar.classList.toggle('hide', hide);
  // 顶栏一收，内容区就变高 → 滚动容器尺寸变化 → 又派发一次 scroll，
  // 方向相反就会来回抖。加一段冷却把这个反馈回路掐断。
  _topbarLock = performance.now() + 400;
}

document.addEventListener('scroll', e => {
  const el = e.target;
  if (!(el instanceof Element)) return;
  if (el.closest(IGNORE_SCROLL)) return;

  const y    = el.scrollTop;
  const prev = _lastScroll.get(el) ?? 0;
  _lastScroll.set(el, y);
  if (performance.now() < _topbarLock) return;

  const d = y - prev;
  if (Math.abs(d) < 8) return;            // 忽略抖动
  if (y < 40) setTopbarHidden(false);
  else setTopbarHidden(d > 0);
}, true);

// ── Theme toggle ───────────────────────────────────
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

// ── Init ───────────────────────────────────────────
initTheme();
initAuth();      // 异步恢复会话；恢复完 onAuthChange 会把 UI 刷成 EDITING
initSidebar();
syncToggleBtns();
buildNav();

// hash 是唯一的真实来源：地址栏变了就跟着走
onRouteChange(({ page, parts }) => navigate(page || 'library', parts));
const _r0 = parseHash();
navigate(_r0.page || 'library', _r0.parts);
</script>
